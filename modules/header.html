<!-- =====================================================================
       HEADER (fixed top bar)
  ====================================================================== -->
<header class="site-header" id="site-header">
  <div class="site-header__top">
    <!-- Partner logo: TTXVN -->
    <div class="header-left">
      <a href="#" class="partner-logo-link" aria-label="TTXVN – Vietnam News Agency">
        <img class="partner-logo" src="/skin/logo-TTXVN.png" alt="TTXVN – Vietnam News Agency" />
      </a>
      <button class="btn-burger" aria-label="Menu" aria-expanded="false">
        <!-- Burger Icon -->
        <svg class="icon-burger" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 4H18" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M2 10H18" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M2 16H18" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <!-- Close Icon (X) -->
        <svg class="icon-close" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 4L16 16" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 4L4 16" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- CDS Logo (centre) -->
    <div>
      <a href="#" aria-label="Chuyển Động Số">
        <img class="cds-logo" src="/skin/cds-logo-dark.svg" alt="Chuyển Động Số" />
      </a>
    </div>

    <!-- Search + Login -->
    <div class="header-actions">
      <button class="btn-search" aria-label="Tìm kiếm">
        <img src="skin/white-search-icon.svg" alt="" />
      </button>
      <button class="btn-login">Đăng nhập</button>
    </div>

    <!-- Expand Menu (Mega Menu) -->
    <div class="site-header__menu-expand" id="menu-expand"></div>
  </div>
  <!-- =====================================================================
       NAV MENU (sticky category navigation)
  ====================================================================== -->
  <nav class="site-nav" id="site-nav" aria-label="Danh mục chính">
    <div class="site-nav__inner">
      <!-- Home icon -->
      <a class="site-nav__home-icon" href="#" aria-label="Trang chủ">
        <img src="skin/white-home-icon.svg" alt="Trang chủ" />
      </a>

      <!-- Nav items -->
      <a class="site-nav__item" href="#">
        <span>Chính sách</span>
        <img class="dropdown-arrow" src="skin/white-arrow-down.svg" alt="" aria-hidden="true" />
      </a>
      <a class="site-nav__item" href="#">
        <span>Khoa học - Công nghệ</span>
        <img class="dropdown-arrow" src="skin/white-arrow-down.svg" alt="" aria-hidden="true" />
      </a>
      <a class="site-nav__item" href="#">
        <span>Đổi mới sáng tạo</span>
        <img class="dropdown-arrow" src="skin/white-arrow-down.svg" alt="" aria-hidden="true" />
      </a>
      <a class="site-nav__item" href="#">
        <span>An ninh mạng</span>
        <img class="dropdown-arrow" src="skin/white-arrow-down.svg" alt="" aria-hidden="true" />
      </a>
      <a class="site-nav__item" href="#">
        <span>Nhân vật</span>
      </a>
      <a class="site-nav__item" href="#">
        <span>Tiêu điểm</span>
      </a>
      <a class="site-nav__item" href="#">
        <span>Multimedia</span>
      </a>
      <a class="site-nav__item" href="#">
        <span>Global</span>
        <img class="dropdown-arrow" src="skin/white-arrow-down.svg" alt="" aria-hidden="true" />
      </a>
      <a class="site-nav__item" href="#">
        <span>Newswire</span>
      </a>
    </div>
  </nav>
</header>
